version: '3.8'

services:
  web:
    build:
      context: ./web
      args:
        - VITE_API_URL=https://wires-and-ladders-api.vercel.app/
    container_name: web_app
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - api_db
    networks:
      - wl_network

  redis-server:
    image: redis:alpine
    container_name: redis-server
    restart: always
    ports:
      - "6379:6379"
    networks:
      - wl_network

  wl-sockets-api-1:
    build: ./apis/socket
    container_name: wl-sockets-api-1
    restart: always
    env_file: ./apis/socket/.dockerenv1
    ports:
      - "3002:3002"
    depends_on:
      - redis-server
    networks:
      - wl_network

  wl-sockets-api-2:
    build: ./apis/socket
    container_name: wl-sockets-api-2
    restart: always
    env_file: ./apis/socket/.dockerenv2
    ports:
      - "3003:3003"
    depends_on:
      - redis-server
    networks:
      - wl_network

  wl-load-balancer:
    image: nginx:alpine
    container_name: wl-load-balancer
    restart: always
    ports:
      - "3005:3005"
    volumes:
      - ./apis/socket/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - wl-sockets-api-1
      - wl-sockets-api-2
    networks:
      - wl_network

networks:
  wl_network:
    external: true
    name: wl_network
