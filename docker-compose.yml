version: '3.8'

services:
  # Base de datos 
  mysql_db:
    image: mysql:latest
    container_name: mysql_server
    restart: always
    environment:
      - TZ=America/Mazatlan
      - MYSQL_ROOT_PASSWORD=Abcd1234?!
      - MYSQL_ROOT_HOST= '%'
      - MYSQL_DATABASE=wires_and_ladders
      - MYSQL_USER=pris
      - MYSQL_PASSWORD=Abcd1234?!
    ports:
       - "3308:3306"
    volumes:
       - ./mysql_data:/var/lib/mysql
    networks:
       - wl_network

  api_db:
    build: ./apis/db
    container_name: api_db
    restart: always
    environment:
      - PORT=3000
      - DB_HOST=mysql_server 
      - DB_PORT=3306
      - DB_USER=pris
      - DB_PASSWORD=Abcd1234?!
      - DB_NAME=wires_and_ladders
      - SECRET=ac49320f56ae1a8ccc68544165c99603239c26f8
    expose:
      - "3000"
    ports:
      - "3000:3000"
    networks:
      - wl_network

  web:
    build:
      context: ./web
      args:
        - VITE_API_URL=/api
    container_name: web_app
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - api_db
    networks:
      - wl_network

  redis-server:
    image: redis:alpine
    container_name: redis-server
    restart: always
    ports:
      - "6379:6379"
    networks:
      - wl_network

  wl-sockets-api-1:
    build: ./apis/socket
    container_name: wl-sockets-api-1
    restart: always
    env_file: ./apis/socket/.dockerenv1
    ports:
      - "3002:3002"
    depends_on:
      - redis-server
    networks:
      - wl_network

  wl-sockets-api-2:
    build: ./apis/socket
    container_name: wl-sockets-api-2
    restart: always
    env_file: ./apis/socket/.dockerenv2
    ports:
      - "3003:3003"
    depends_on:
      - redis-server
    networks:
      - wl_network

  wl-load-balancer:
    image: nginx:alpine
    container_name: wl-load-balancer
    restart: always
    ports:
      - "3005:3005"
    volumes:
      - ./apis/socket/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - wl-sockets-api-1
      - wl-sockets-api-2
    networks:
      - wl_network

networks:
  wl_network:
    external: true
    name: wl_network
