events {
    worker_connections 1024;
}

http {
    upstream socket_nodes {
        # 'ip_hash' asegura "sticky sessions" (sesiones persistentes).
        # Esto es vital para que Socket.IO (cuando usa HTTP long-polling) 
        # siempre mande al mismo usuario al mismo contenedor.
        ip_hash;
        
        # host.docker.internal resuelve a la IP de tu anfitrión Windows
        server wl-sockets-api-1:3002;
        server wl-sockets-api-2:3003;
    }

    server {
        listen 3005;

        location / {
            proxy_pass http://socket_nodes;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;

            # Habilitar soporte para WebSockets
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
