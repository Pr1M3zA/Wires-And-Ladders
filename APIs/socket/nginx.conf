events {
    worker_connections 1024;
}

http {
    upstream socket_nodes {
        # 'ip_hash' asegura "sticky sessions" (sesiones persistentes).
        # Esto es vital para que Socket.IO (cuando usa HTTP long-polling)
        # siempre mande al mismo usuario al mismo contenedor.
        ip_hash;

        # host.docker.internal resuelve a la IP de tu anfitrión Windows
        server wl-sockets-api-1:3002;
        server wl-sockets-api-2:3003;
    }

    server {
        listen 80;
        server_name wiresandladders.duckdns.org;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name wiresandladders.duckdns.org;

        ssl_certificate /etc/letsencrypt/live/wiresandladders.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/wiresandladders.duckdns.org/privkey.pem;
        # Optimización y seguridad SSL
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        # RUTA PARA LOS SOCKETS (Socket.IO)
        location /socket.io/ {
            proxy_pass http://socket_nodes;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        # RUTA PARA LA PÁGINA WEB (React / Vite)
    	location / {
            proxy_pass http://web:80; # Redirige internamente al contenedor 'web' por el puerto 80
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}